<script>
const data=JSON.parse(document.getElementById('payload').textContent);
const home=document.getElementById('home'), viewer=document.getElementById('viewer');
const cards=Array.from(document.querySelectorAll('.bank'));
const frames=new Map();
function navigate(){
 const match=/^#bank-([0-2])$/.exec(location.hash);
 home.hidden=!!match;viewer.hidden=!match;
 if(!match)return;
 const id=Number(match[1]);
 const name=cards[id].querySelector('.name').textContent;
 document.getElementById('activeName').textContent=name;
 if(!frames.has(id)){
   const frame=document.createElement('iframe');
   frame.title=name;
   const bytes=Uint8Array.from(atob(data[id]),c=>c.charCodeAt(0));
   frame.srcdoc=new TextDecoder().decode(bytes);
   viewer.append(frame);
   frames.set(id,frame);
 }
 for(const [k,frame] of frames) frame.hidden=k!==id;
}
for(const card of cards)card.onclick=()=>{location.hash='bank-'+card.dataset.bank;};
document.getElementById('back').onclick=()=>{history.replaceState(null,'',location.href.split('#')[0]);navigate();};
window.addEventListener('hashchange',navigate);
navigate();
</script></body></html>
